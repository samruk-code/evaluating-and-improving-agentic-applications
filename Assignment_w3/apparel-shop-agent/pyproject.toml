[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apparel-shop-agent"
version = "0.1.0"
description = "Educational database-backed apparel shop agent demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

